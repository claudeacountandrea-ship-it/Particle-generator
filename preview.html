<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX Spritesheet Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #ccc; font: 13px/1.4 'Consolas', monospace; overflow-x: hidden; }

  .header {
    padding: 12px 20px;
    background: #1a1a2e;
    border-bottom: 1px solid #333;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .header h1 { font-size: 14px; color: #8af; white-space: nowrap; }

  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls label { color: #888; font-size: 11px; }
  .controls select, .controls input {
    background: #222; color: #ddd; border: 1px solid #444;
    padding: 4px 8px; border-radius: 3px; font: 12px monospace;
  }
  .controls button {
    background: #2a4a7a; color: #aad; border: 1px solid #456;
    padding: 4px 12px; border-radius: 3px; cursor: pointer; font: 12px monospace;
  }
  .controls button:hover { background: #3a5a9a; }
  .controls button.active { background: #4a7aba; color: #fff; }

  .main { display: flex; height: calc(100vh - 50px); }

  .canvas-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#1a1a1a 0% 25%, #151515 0% 50%) 0 0 / 20px 20px;
  }
  canvas { image-rendering: pixelated; }

  .info-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 6px 20px; background: rgba(10,10,20,0.9);
    border-top: 1px solid #333; font-size: 11px; color: #666;
    display: flex; gap: 20px;
  }
  .info-bar span { color: #888; }
  .info-bar .val { color: #aaf; }
</style>
</head>
<body>

<div class="header">
  <h1>VFX Spritesheet Preview</h1>
  <div class="controls">
    <label>Effect:</label>
    <select id="effectSelect">
      <option value="energy">Energy Accumulation</option>
      <option value="lightning">Lightning</option>
      <option value="explosion">Explosion</option>
      <option value="fire">Fire</option>
    </select>

    <label>FPS:</label>
    <input type="range" id="fpsSlider" min="4" max="60" value="24" style="width:80px">
    <span id="fpsVal" style="color:#aaf;width:28px">24</span>

    <label>BG:</label>
    <select id="bgSelect">
      <option value="checker">Checker</option>
      <option value="black">Black</option>
      <option value="dark">Dark Gray</option>
      <option value="white">White</option>
    </select>

    <button id="btnPause">Pause</button>
    <button id="btnReset">Reset</button>
  </div>
</div>

<div class="main">
  <div class="canvas-area" id="canvasArea">
    <canvas id="c" width="800" height="800"></canvas>
  </div>
</div>

<div class="info-bar">
  <span>Frame: <b class="val" id="infoFrame">0/64</b></span>
  <span>Time: <b class="val" id="infoTime">0.0%</b></span>
  <span>Particles: <b class="val" id="infoCount">0</b></span>
  <span>FPS: <b class="val" id="infoFPS">0</b></span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 800;
canvas.width = W; canvas.height = H;
const CX = W / 2, CY = H / 2;

// ── Shared ──────────────────────────────────────────────

const TOTAL_FRAMES = 64;
let currentEffect = 'energy';
let fps = 24;
let paused = false;
let frameIdx = 0;
let lastFrameTime = 0;
let actualFps = 0;

// Seeded random
function makeRand(s) {
  let seed = s;
  return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
}

// Simple noise (good enough for preview)
function noise(x, y, z) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + (z || 0) * 45.164) * 43758.5453;
  return (n - Math.floor(n)) * 2 - 1;
}

// ── Energy Effect ───────────────────────────────────────

const energyParticles = [];
function initEnergy() {
  energyParticles.length = 0;
  const rand = makeRand(77);
  const PATH_COUNT = 180, PER_PATH = 2;
  for (let p = 0; p < PATH_COUNT; p++) {
    const angle = rand() * Math.PI * 2;
    for (let j = 0; j < PER_PATH; j++) {
      const phase = (p * PER_PATH + j) / (PATH_COUNT * PER_PATH);
      energyParticles.push({
        angle, phase: (phase + rand() * 0.005) % 1,
        bright: 205 + Math.floor(rand() * 50),
        lengthMult: 2.5 + rand() * 1.5,
        noiseSeed: rand() * 1000
      });
    }
  }
}

function renderEnergy(t) {
  const MAX_DIST = 500;
  const sorted = [];
  for (const p of energyParticles) {
    let progress = (t + p.phase) % 1;
    let sn = noise(p.noiseSeed, t * 3, 0) * 0.15;
    let ep = Math.min(1, Math.max(0, progress + sn * progress));
    let eased = ep ** 2;
    let dist = MAX_DIST * (1 - eased);
    if (dist < 2) dist = 2;
    let wobble = noise(p.noiseSeed + 100, t * 4, progress * 2) * 0.06 * (1 - progress);
    let angle = p.angle + wobble;
    let x = CX + Math.cos(angle) * dist;
    let y = CY + Math.sin(angle) * dist;
    let dr = dist / MAX_DIST;
    let alpha = 1;
    if (progress < 0.04) alpha = progress / 0.04;
    else if (progress > 0.88) alpha = (1 - progress) / 0.12;

    if (alpha < 0.01) continue;
    let bw = 4 + dr * 14;
    sorted.push({ x, y, angle, dist, alpha, bw, len: bw * p.lengthMult,
      hW: bw * (0.25 + dr * 0.15), tW: bw, bright: p.bright, dr });
  }
  sorted.sort((a, b) => b.dist - a.dist);

  for (const s of sorted) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);
    ctx.globalAlpha = s.alpha;
    const hH = s.hW / 2, tH = s.tW / 2;
    ctx.beginPath();
    ctx.moveTo(0, -hH); ctx.lineTo(s.len, -tH);
    ctx.lineTo(s.len, tH); ctx.lineTo(0, hH); ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, s.len, 0);
    const b = s.bright;
    grad.addColorStop(0, `rgba(255,255,255,${s.alpha})`);
    grad.addColorStop(0.3, `rgba(${b},${b},${Math.min(255,b+10)},${s.alpha*0.8})`);
    grad.addColorStop(1, `rgba(${b},${b},${Math.min(255,b+10)},${s.alpha*0.15})`);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -hH*0.6); ctx.lineTo(s.len*0.2, -hH*0.8);
    ctx.lineTo(s.len*0.2, hH*0.8); ctx.lineTo(0, hH*0.6); ctx.closePath();
    ctx.fillStyle = `rgba(255,255,255,${s.alpha*0.6})`;
    ctx.fill();
    ctx.restore();
  }

  // Core
  ctx.globalAlpha = 1;
  const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 4);
  const cr = 5 + pulse * 3;
  const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, cr + 30);
  cg.addColorStop(0, 'rgba(255,255,255,0.8)');
  cg.addColorStop(0.3, 'rgba(220,235,255,0.15)');
  cg.addColorStop(1, 'transparent');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(CX, CY, cr + 30, 0, Math.PI * 2); ctx.fill();

  return sorted.length;
}

// ── Lightning Effect ────────────────────────────────────

function midpointDisplace(pts, disp, t, seedOff) {
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1,y1] = pts[i], [x2,y2] = pts[i+1];
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const dx = x2-x1, dy = y2-y1;
    const sl = Math.sqrt(dx*dx+dy*dy);
    if (sl < 1) { out.push([mx,my], [x2,y2]); continue; }
    const px = -dy/sl, py = dx/sl;
    const n = noise(mx*0.01+seedOff, my*0.01, t);
    out.push([mx + px*n*disp*sl, my + py*n*disp*sl]);
    out.push([x2, y2]);
  }
  return out;
}

function renderLightning(t) {
  const BOLT_COUNT = 3;
  let count = 0;
  const nt = t * 2;
  const flicker = 0.6 + 0.4 * Math.abs(Math.sin(t * Math.PI * 8));

  for (let bi = 0; bi < BOLT_COUNT; bi++) {
    const phase = (t + bi / BOLT_COUNT) % 1;
    if (phase > 0.4) continue;
    let ba = phase < 0.04 ? phase / 0.04 : phase > 0.28 ? (0.4 - phase) / 0.12 : 1;
    ba *= flicker;
    if (ba < 0.01) continue;

    const angle = (bi / BOLT_COUNT) * Math.PI * 2 + noise(bi * 10, t * 2, 0) * 0.5;
    const ed = W * 0.45;
    let pts = [[CX + Math.cos(angle) * ed, CY + Math.sin(angle) * ed],
               [CX + noise(bi*20,t*3,5)*15, CY + noise(bi*20+50,t*3,5)*15]];

    let d = 0.35;
    for (let s = 0; s < 6; s++) { pts = midpointDisplace(pts, d, nt, bi*100+s*7.3); d *= 0.55; }

    // Glow
    ctx.globalAlpha = ba * 0.6;
    ctx.strokeStyle = 'rgba(100,140,255,0.7)';
    ctx.lineWidth = 8;
    ctx.beginPath(); pts.forEach(([x,y],i) => i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y)); ctx.stroke();

    // Core
    ctx.globalAlpha = ba;
    ctx.strokeStyle = 'rgba(220,235,255,0.95)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); pts.forEach(([x,y],i) => i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y)); ctx.stroke();
    count += pts.length;
  }

  // Flash
  ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(t * Math.PI * 12));
  const fg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 25);
  fg.addColorStop(0, 'rgba(200,220,255,0.8)');
  fg.addColorStop(1, 'transparent');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(CX, CY, 25, 0, Math.PI*2); ctx.fill();

  return count;
}

// ── Explosion Effect ────────────────────────────────────

const explosionDebris = [];
function initExplosion() {
  explosionDebris.length = 0;
  const rand = makeRand(123);
  for (let i = 0; i < 120; i++) {
    explosionDebris.push({
      angle: rand() * Math.PI * 2 + (rand()-0.5)*0.4,
      speed: 0.3 + rand() * 0.7,
      size: 2 + rand() * 6,
      temp: 0.2 + rand() * 0.6,
      ns: rand() * 1000,
      trail: 1 + rand() * 2,
    });
  }
}

function renderExplosion(t) {
  const MAX_D = W * 0.45;
  const bf = 0.15;
  let bt = t < bf ? -1 + t/bf : (t-bf)/(1-bf);
  let count = 0;

  if (bt < 0) {
    // Buildup
    const bu = 1 + bt;
    for (let i = 0; i < 40; i++) {
      const d = explosionDebris[i];
      const dist = MAX_D * (1 - bu * 0.8);
      const px = CX + Math.cos(d.angle) * dist, py = CY + Math.sin(d.angle) * dist;
      ctx.globalAlpha = bu * 0.6;
      ctx.fillStyle = 'rgba(255,240,200,1)';
      ctx.beginPath(); ctx.arc(px, py, d.size * 0.5, 0, Math.PI*2); ctx.fill();
      count++;
    }
    const gr = 15 * bu * bu;
    const gg = ctx.createRadialGradient(CX,CY,0,CX,CY,gr);
    gg.addColorStop(0, `rgba(255,250,230,${bu})`);
    gg.addColorStop(1, 'transparent');
    ctx.globalAlpha = 1; ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(CX,CY,gr,0,Math.PI*2); ctx.fill();
    return count;
  }

  // Flash
  if (bt < 0.15) {
    const ft = bt / 0.15;
    const fr = MAX_D * 0.15 * (1 - (1-ft)*(1-ft));
    ctx.globalAlpha = 1 - ft*ft;
    const fg = ctx.createRadialGradient(CX,CY,0,CX,CY,fr);
    fg.addColorStop(0, 'rgba(255,255,230,1)');
    fg.addColorStop(1, 'transparent');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(CX,CY,fr,0,Math.PI*2); ctx.fill();
  }

  // Shockwave
  if (bt < 0.6) {
    const st = bt / 0.6;
    const sr = MAX_D * 0.9 * (1-(1-st)*(1-st)*(1-st));
    const sw = Math.max(2, 12 * (1-st*0.7));
    ctx.globalAlpha = (1-st*st) * 0.7;
    ctx.strokeStyle = 'rgba(255,240,220,1)';
    ctx.lineWidth = sw;
    ctx.beginPath(); ctx.arc(CX,CY,sr,0,Math.PI*2); ctx.stroke();
  }

  // Debris
  for (const d of explosionDebris) {
    const et = 1-(1-Math.min(1,bt*1.2))**3;
    const dist = MAX_D * d.speed * et;
    const w = noise(d.ns, bt*3, 0) * 0.15;
    const a = d.angle + w;
    const px = CX+Math.cos(a)*dist, py = CY+Math.sin(a)*dist;
    let alpha = bt > 0.4 ? Math.max(0, 1-(bt-0.4)/0.6*(bt-0.4)/0.6) : 1;
    if (alpha < 0.01) continue;
    const tmp = Math.min(1, d.temp + bt*0.4);
    const r = tmp<0.4 ? 255 : Math.max(180,255-tmp*120);
    const g = tmp<0.4 ? 255-tmp*200 : Math.max(60,180-tmp*180);
    const b = tmp<0.4 ? 220-tmp*400 : Math.max(20,60-tmp*60);
    const sz = Math.max(1, d.size * (1-bt*0.5));
    // Trail
    const tl = sz * d.trail * 3 * (1-bt*0.5);
    if (tl > 2) {
      ctx.globalAlpha = alpha * 0.4;
      ctx.strokeStyle = `rgb(${r},${g},${b})`;
      ctx.lineWidth = sz;
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(px+Math.cos(a+Math.PI)*tl, py+Math.sin(a+Math.PI)*tl);
      ctx.stroke();
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.beginPath(); ctx.arc(px,py,sz,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = alpha * 0.8;
    ctx.fillStyle = 'rgba(255,255,240,1)';
    ctx.beginPath(); ctx.arc(px,py,sz/2,0,Math.PI*2); ctx.fill();
    count++;
  }
  return count;
}

// ── Fire Effect ─────────────────────────────────────────

const fireParticles = [];
const fireEmbers = [];
function initFire() {
  fireParticles.length = 0; fireEmbers.length = 0;
  const rand = makeRand(55);
  for (let i = 0; i < 200; i++) {
    fireParticles.push({
      phase: rand(), xOff: (rand()-0.5)*2,
      speed: 0.5+rand()*0.7, size: 3+rand()*9, ns: rand()*1000
    });
  }
  const rand2 = makeRand(7777+55);
  for (let i = 0; i < 30; i++) {
    fireEmbers.push({
      phase: rand2(), xOff: (rand2()-0.5)*1.5,
      speed: 0.8*(0.5+rand2()*0.5), ns: rand2()*1000
    });
  }
}

function fireColor(h) {
  if (h < 0.15) return [255,255,220];
  if (h < 0.45) { const t=(h-0.15)/0.3; return [255, 255-Math.floor(55*t+145*t), 220-Math.floor(170*t)]; }
  if (h < 0.75) { const t=(h-0.45)/0.3; return [255-Math.floor(55*t), 100-Math.floor(40*t), 20+Math.floor(10*t)]; }
  const t = (h-0.75)/0.25;
  return [200-Math.floor(120*t), 60-Math.floor(t*10), 20+Math.floor(45*t)];
}

function renderFire(t) {
  const nt = t * 3;
  const OY = H * 0.75, FH = H * 0.7, FW = W * 0.3;
  let count = 0;

  for (const p of fireParticles) {
    const prog = (t * p.speed + p.phase) % 1;
    const py = OY - prog * FH;
    const bx = CX + p.xOff * FW * 0.5 * (1 - prog * 0.5);
    const ndx = noise(p.ns, py * 0.008, nt) * 40 * (0.3 + prog * 0.7);
    const px = bx + ndx;
    const wf = (1 - prog * 0.8) * (1 - Math.abs(p.xOff) * 0.3);
    const sz = Math.max(1, p.size * wf);
    let alpha = 1;
    if (prog < 0.05) alpha = prog / 0.05;
    else if (prog > 0.6) alpha = (1-prog)/0.4;
    alpha *= wf;
    if (alpha < 0.01) continue;
    const [r,g,b] = fireColor(prog);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.beginPath(); ctx.arc(px, py, sz, 0, Math.PI*2); ctx.fill();
    count++;
  }

  // Base glow
  ctx.globalAlpha = 0.4;
  const bg = ctx.createRadialGradient(CX, OY, 0, CX, OY, FW*0.6);
  bg.addColorStop(0, 'rgba(255,255,220,1)');
  bg.addColorStop(1, 'transparent');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(CX, OY, FW*0.6, 0, Math.PI*2); ctx.fill();

  // Embers
  for (const e of fireEmbers) {
    const prog = (t * e.speed + e.phase) % 1;
    let ey = OY - prog * FH * 1.2;
    let ex = CX + e.xOff * FW * 0.8;
    ex += noise(e.ns, prog*5, nt) * FW * 0.12;
    ey += noise(e.ns+50, prog*5, nt) * FH * 0.04;
    let alpha = 1;
    if (prog < 0.1) alpha = prog / 0.1;
    else if (prog > 0.5) alpha = (1-prog)/0.5;
    if (alpha < 0.01) continue;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(255,200,100,1)';
    ctx.beginPath(); ctx.arc(ex, ey, 2, 0, Math.PI*2); ctx.fill();
    count++;
  }
  return count;
}

// ── Main render loop ────────────────────────────────────

const bgColors = { checker: null, black: '#000', dark: '#222', white: '#fff' };
let bgMode = 'checker';

function drawCheckerBg() {
  const sz = 16;
  for (let y = 0; y < H; y += sz) {
    for (let x = 0; x < W; x += sz) {
      ctx.fillStyle = ((x/sz + y/sz) % 2 === 0) ? '#1a1a1a' : '#151515';
      ctx.fillRect(x, y, sz, sz);
    }
  }
}

function render(timestamp) {
  if (!paused) {
    const elapsed = timestamp - lastFrameTime;
    if (elapsed >= 1000 / fps) {
      actualFps = Math.round(1000 / Math.max(1, elapsed));
      lastFrameTime = timestamp;

      const t = (frameIdx % TOTAL_FRAMES) / TOTAL_FRAMES;

      // Background
      if (bgMode === 'checker') drawCheckerBg();
      else { ctx.fillStyle = bgColors[bgMode]; ctx.fillRect(0,0,W,H); }

      ctx.globalAlpha = 1;
      let count = 0;

      switch (currentEffect) {
        case 'energy': count = renderEnergy(t); break;
        case 'lightning': count = renderLightning(t); break;
        case 'explosion': count = renderExplosion(t); break;
        case 'fire': count = renderFire(t); break;
      }

      ctx.globalAlpha = 1;
      document.getElementById('infoFrame').textContent = `${frameIdx % TOTAL_FRAMES}/${TOTAL_FRAMES}`;
      document.getElementById('infoTime').textContent = `${(t*100).toFixed(1)}%`;
      document.getElementById('infoCount').textContent = count;
      document.getElementById('infoFPS').textContent = actualFps;

      frameIdx++;
    }
  }
  requestAnimationFrame(render);
}

// ── Init & Controls ─────────────────────────────────────

function initEffect(name) {
  currentEffect = name;
  frameIdx = 0;
  switch (name) {
    case 'energy': initEnergy(); break;
    case 'explosion': initExplosion(); break;
    case 'fire': initFire(); break;
  }
}

document.getElementById('effectSelect').addEventListener('change', e => initEffect(e.target.value));
document.getElementById('fpsSlider').addEventListener('input', e => {
  fps = parseInt(e.target.value);
  document.getElementById('fpsVal').textContent = fps;
});
document.getElementById('bgSelect').addEventListener('change', e => { bgMode = e.target.value; });
document.getElementById('btnPause').addEventListener('click', e => {
  paused = !paused;
  e.target.textContent = paused ? 'Play' : 'Pause';
  e.target.classList.toggle('active', paused);
});
document.getElementById('btnReset').addEventListener('click', () => { frameIdx = 0; });

initEnergy();
initExplosion();
initFire();
requestAnimationFrame(render);
</script>
</body>
</html>
