<title>Masmorra Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Grenze+Gotisch:wght@600&display=swap">
<style>
/* Layout: phone-first column — the open pizarra (title, notes, square canvas, tools) on top, the gallery of pizarras below */
:root {
  --bg: #eef0ec;
  --panel: #f8f9f6;
  --ink: #23271f;
  --muted: #6b7163;
  --grid: #b9beb1;
  --wall: #3a3226;
  --col: #8a5a2b;
  --accent: #4f6b3a;
  --claude: #7a5a9a;
  --danger: #a3402f;
  --line: #d5d9cf;
  --f-display: "Grenze Gotisch", Georgia, serif;
  --f-ui: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161813; --panel: #1f221b; --ink: #e4e6dd; --muted: #939988; --grid: #4a4f42;
    --wall: #e8dcc4; --col: #d39a5c; --accent: #9cbc7e; --claude: #c3a6e0; --danger: #e07a64; --line: #33372d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161813; --panel: #1f221b; --ink: #e4e6dd; --muted: #939988; --grid: #4a4f42;
  --wall: #e8dcc4; --col: #d39a5c; --accent: #9cbc7e; --claude: #c3a6e0; --danger: #e07a64; --line: #33372d;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-ui); }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 32px; display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
h1 { font: 600 28px/1 var(--f-display); margin: 0; letter-spacing: .5px; }
h2 { font: 600 21px/1 var(--f-display); margin: 14px 0 0; }
.stat, .sync { color: var(--muted); font-variant-numeric: tabular-nums; }
#cv { width: 100%; aspect-ratio: 1; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; touch-action: none; display: block; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; }
button, select, input, textarea { font: inherit; color: var(--ink); }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-height: 42px; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); flex: 1; }
button.warn { color: var(--danger); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
label { color: var(--muted); font-size: 12px; }
select, input[type=text], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
select, input[type=text] { min-height: 40px; }
input[type=text] { flex: 1; min-width: 0; font-weight: 600; }
textarea { width: 100%; box-sizing: border-box; min-height: 72px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 4px; }
.who { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor; }
.who.claude { color: var(--claude); }
.who.user { color: var(--accent); }
.claude-note { border-left: 3px solid var(--claude); padding: 6px 10px; background: var(--panel); border-radius: 0 6px 6px 0; white-space: pre-wrap; margin: 0; }
.help { color: var(--muted); margin: 0; }
.help b { color: var(--ink); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.legend .lc { width: 10px; height: 10px; background: var(--col); }
.legend .lw { width: 18px; height: 3px; background: var(--wall); }
.legend .lp { width: 4px; height: 4px; border-radius: 50%; background: var(--grid); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { min-height: 34px; padding: 6px 10px; font-size: 12px; }
#gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; min-height: 0; }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card canvas { width: 100%; aspect-ratio: 1; display: block; }
.card b { font-weight: 600; font-size: 12px; overflow-wrap: anywhere; }
.card p { margin: 0; font-size: 11px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.card .todo { font-size: 10px; color: var(--claude); }
.card.new { align-items: center; justify-content: center; border-style: dashed; min-height: 150px; color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); grid-column: 1 / -1; }
#out { min-height: 110px; font-size: 11px; line-height: 1.35; }
details summary { cursor: pointer; color: var(--muted); padding-block: 6px; }
#toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; z-index: 9; }
</style>

<div class="wrap">
  <header>
    <h1>Masmorra Sketch</h1>
    <span class="sync" id="sync">cargando…</span>
  </header>

  <div class="row">
    <span class="who user" id="who">Tú</span>
    <input type="text" id="title" placeholder="Nombre de la pizarra">
  </div>
  <p class="claude-note" id="claudeNote" hidden></p>

  <canvas id="cv"></canvas>
  <div class="row" style="justify-content: space-between">
    <div class="legend"><span><i class="lp"></i>punto</span><span><i class="lc"></i>columna</span><span><i class="lw"></i>pared</span></div>
    <span class="stat" id="stat"></span>
  </div>

  <div class="bar">
    <button id="mDraw" class="on">✎ Dibujar</button>
    <button id="mErase">⌫ Borrar</button>
    <button id="undo">↶</button>
    <button id="clear" class="warn">Limpiar</button>
    <select id="size" aria-label="Tamaño del grid">
      <option value="5">5×5</option><option value="7">7×7</option><option value="9" selected>9×9</option>
      <option value="11">11×11</option><option value="13">13×13</option><option value="17">17×17</option>
    </select>
  </div>
  <p class="help"><b>Toca</b> un punto = columna. <b>Arrastra</b> de punto a punto = pared (8 vecinos: rectas y diagonales).</p>

  <div class="field">
    <label for="note" id="noteLabel">Explica qué es y por qué lo dibujaste así</label>
    <textarea id="note" placeholder="Ej: sala de guardia; la esquina diagonal es para que el pasillo entre en ángulo…"></textarea>
  </div>
  <div class="bar">
    <button id="save" class="primary">Guardar pizarra</button>
    <button id="del" class="warn" hidden>Eliminar</button>
  </div>

  <h2>Pizarras</h2>
  <div class="filters" id="filters">
    <button data-f="all" class="on">Todas</button>
    <button data-f="claude">De Claude</button>
    <button data-f="todo">Para responder</button>
    <button data-f="user">Tuyas</button>
  </div>
  <div id="gallery"></div>

  <details>
    <summary>Exportar / importar JSON (para Kaggle)</summary>
    <div class="field">
      <p class="help">Cada pizarra trae <b>columns</b>, <b>walls</b>, los textos y <b>grid[y][x] = [columna, E, SE, S, SO]</b>.</p>
      <div class="bar">
        <button id="copy" class="primary">Copiar JSON</button>
        <button id="import">Importar del cuadro</button>
      </div>
      <textarea id="out" spellcheck="false" aria-label="JSON"></textarea>
    </div>
  </details>
</div>
<div id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const LOCAL = 'masmorra-sketch-v2';
const COL = 'sketches';

// ---------- state ----------
let N = 9, columns = new Set(), walls = new Set();
let mode = 'draw', history = [], dirty = false;
let pads = [];          // [{id, ...data}]
let openId = null;      // id of the pad in the editor (null = new)
let filter = 'all';
let db = null;

const vk = (x, y) => x + ',' + y;
function wk(a, b) {
  const [p, q] = (a[1] < b[1] || (a[1] === b[1] && a[0] <= b[0])) ? [a, b] : [b, a];
  return vk(p[0], p[1]) + '|' + vk(q[0], q[1]);
}
const parseW = k => k.split('|').map(s => s.split(',').map(Number));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800); }
function snapshot() { history.push({ c: [...columns], w: [...walls] }); if (history.length > 200) history.shift(); }

// ---------- drawing ----------
let pad, step;
function layout() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.width * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pad = r.width * 0.06; step = (r.width - 2 * pad) / (N - 1);
  draw();
}
const px = x => pad + x * step;

function drawInto(c, size, n, cols, ws, live) {
  const g = c.getContext('2d');
  const p = live ? pad : size * 0.08, s = live ? step : (size - 2 * p) / (n - 1);
  const X = v => p + v * s;
  g.clearRect(0, 0, size, size);
  g.strokeStyle = css('--line'); g.lineWidth = 1;
  for (let i = 0; i < n; i++) {
    g.beginPath(); g.moveTo(X(i), X(0)); g.lineTo(X(i), X(n - 1)); g.stroke();
    g.beginPath(); g.moveTo(X(0), X(i)); g.lineTo(X(n - 1), X(i)); g.stroke();
  }
  g.strokeStyle = css('--wall'); g.lineCap = 'round'; g.lineWidth = Math.max(2, s * 0.18);
  for (const k of ws) { const [a, b] = parseW(k); g.beginPath(); g.moveTo(X(a[0]), X(a[1])); g.lineTo(X(b[0]), X(b[1])); g.stroke(); }
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (cols.has(vk(x, y))) { g.fillStyle = css('--col'); const r = Math.max(3, s * 0.2); g.fillRect(X(x) - r, X(y) - r, 2 * r, 2 * r); }
    else { g.fillStyle = css('--grid'); g.beginPath(); g.arc(X(x), X(y), Math.max(1.2, s * 0.06), 0, 7); g.fill(); }
  }
}

let cursor = null;
function draw() {
  drawInto(cv, cv.getBoundingClientRect().width, N, columns, walls, true);
  if (cursor) {
    ctx.strokeStyle = mode === 'draw' ? css('--accent') : css('--danger'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px(cursor.x), px(cursor.y), step * 0.32, 0, 7); ctx.stroke();
  }
  $('stat').textContent = `${N}×${N} · ${columns.size} col · ${walls.size} par`;
}
function hit(e, radius) {
  const r = cv.getBoundingClientRect();
  const fx = (e.clientX - r.left - pad) / step, fy = (e.clientY - r.top - pad) / step;
  const x = Math.round(fx), y = Math.round(fy);
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  return Math.hypot(fx - x, fy - y) <= radius ? { x, y, fx, fy } : { x: null, fx, fy };
}

let dragging = false, moved = false, changed = false;
cv.addEventListener('pointerdown', e => {
  const h = hit(e, 0.5);
  cv.setPointerCapture(e.pointerId);
  dragging = true; moved = false; changed = false; snapshot();
  if (h && h.x !== null) cursor = { x: h.x, y: h.y };
  else { cursor = null; if (mode === 'erase' && h) eraseNearestWall(h.fx, h.fy); }
  draw();
});
cv.addEventListener('pointermove', e => {
  if (!dragging || !cursor) return;
  const h = hit(e, 0.38);
  if (!h || h.x === null || (h.x === cursor.x && h.y === cursor.y)) return;
  if (Math.abs(h.x - cursor.x) > 1 || Math.abs(h.y - cursor.y) > 1) return;
  const k = wk([cursor.x, cursor.y], [h.x, h.y]);
  if (mode === 'draw') walls.add(k); else walls.delete(k);
  changed = moved = true; cursor = { x: h.x, y: h.y }; draw();
});
function end() {
  if (!dragging) return;
  dragging = false;
  if (cursor && !moved) {
    const k = vk(cursor.x, cursor.y);
    if (mode === 'draw') columns.has(k) ? columns.delete(k) : columns.add(k); else columns.delete(k);
    changed = true;
  }
  if (changed) dirty = true; else history.pop();
  cursor = null; draw();
}
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', end);
function eraseNearestWall(fx, fy) {
  let best = null, bd = 0.3;
  for (const k of walls) {
    const [a, b] = parseW(k), d = Math.hypot(fx - (a[0] + b[0]) / 2, fy - (a[1] + b[1]) / 2);
    if (d < bd) { bd = d; best = k; }
  }
  if (best) { walls.delete(best); changed = true; }
}

function setMode(m) { mode = m; $('mDraw').classList.toggle('on', m === 'draw'); $('mErase').classList.toggle('on', m === 'erase'); }
$('mDraw').onclick = () => setMode('draw');
$('mErase').onclick = () => setMode('erase');
$('undo').onclick = () => { const s = history.pop(); if (!s) return; columns = new Set(s.c); walls = new Set(s.w); dirty = true; draw(); };
$('clear').onclick = () => { snapshot(); columns.clear(); walls.clear(); dirty = true; draw(); };
$('size').onchange = e => {
  const n = +e.target.value; snapshot();
  columns = new Set([...columns].filter(k => k.split(',').every(v => +v < n)));
  walls = new Set([...walls].filter(k => parseW(k).flat().every(v => v < n)));
  N = n; dirty = true; layout();
};
$('title').oninput = $('note').oninput = () => dirty = true;

// ---------- pads (store) ----------
const isClaude = p => p && p.author === 'claude';
const needsAnswer = p => isClaude(p) && p.ask && !(p.reply || '').trim();
function sortPads() { pads.sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || (a.createdAt || 0) - (b.createdAt || 0)); }

function openPad(id) {
  const p = pads.find(q => q.id === id) || null;
  openId = p ? p.id : null; history = []; dirty = false;
  N = p?.size || 9; $('size').value = String(N);
  columns = new Set(p?.columns || []); walls = new Set(p?.walls || []);
  $('title').value = p?.title || '';
  const c = isClaude(p);
  $('who').textContent = c ? 'Claude' : 'Tú';
  $('who').className = 'who ' + (c ? 'claude' : 'user');
  $('claudeNote').hidden = !c; $('claudeNote').textContent = p?.desc || '';
  $('noteLabel').textContent = c ? (p.ask ? 'Tu respuesta (dibuja arriba y explica aquí)' : 'Tu comentario: ¿está bien así? ¿qué cambiarías?') : 'Explica qué es y por qué lo dibujaste así';
  $('note').value = c ? (p.reply || '') : (p?.desc || '');
  $('del').hidden = !p || c;
  layout(); renderGallery();
}

function collect() {
  const p = pads.find(q => q.id === openId);
  const base = { size: N, columns: [...columns], walls: [...walls], title: $('title').value.trim(), updatedAt: Date.now() };
  if (isClaude(p)) return { ...base, reply: $('note').value.trim() };
  return { ...base, desc: $('note').value.trim(), author: 'user', createdAt: p?.createdAt || Date.now() };
}

$('save').onclick = async () => {
  const data = collect();
  if (!data.title) data.title = 'Pizarra ' + (pads.filter(p => !isClaude(p)).length + 1);
  const id = openId || 'u' + Date.now().toString(36);
  const prev = pads.find(q => q.id === id);
  const merged = { ...(prev || {}), ...data, id };
  try {
    if (db) { const { id: _, ...body } = merged; await db.collection(COL).doc(id).set(body); }
    else { upsertLocal(merged); }
    openId = id; dirty = false; toast('Guardado');
  } catch (e) { toast('No se pudo guardar: ' + (e?.code || e?.message || 'error')); }
};
let delArm = false;
$('del').onclick = async () => {
  if (!delArm) { delArm = true; $('del').textContent = '¿Seguro?'; setTimeout(() => { delArm = false; $('del').textContent = 'Eliminar'; }, 3000); return; }
  delArm = false; $('del').textContent = 'Eliminar';
  try {
    if (db) await db.collection(COL).doc(openId).delete();
    else { pads = pads.filter(p => p.id !== openId); saveLocal(); }
    openPad(null); toast('Eliminada');
  } catch (e) { toast('No se pudo eliminar'); }
};

function loadLocal() { try { return JSON.parse(localStorage.getItem(LOCAL)) || []; } catch { return []; } }
function saveLocal() { try { localStorage.setItem(LOCAL, JSON.stringify(pads)); } catch {} renderGallery(); }
function upsertLocal(p) { const i = pads.findIndex(q => q.id === p.id); if (i >= 0) pads[i] = p; else pads.push(p); sortPads(); saveLocal(); }

// ---------- gallery ----------
$('filters').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  [...$('filters').children].forEach(x => x.classList.toggle('on', x === b));
  renderGallery();
};
function renderGallery() {
  const box = $('gallery'); box.innerHTML = '';
  const nw = document.createElement('button'); nw.className = 'card new'; nw.textContent = '+ Pizarra en blanco';
  nw.onclick = () => { openPad(null); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  box.append(nw);
  const list = pads.filter(p => filter === 'all' || (filter === 'claude' && isClaude(p)) || (filter === 'user' && !isClaude(p)) || (filter === 'todo' && needsAnswer(p)));
  if (!pads.length) { const e = document.createElement('p'); e.className = 'empty'; e.textContent = db ? 'Aún no hay pizarras. Las de Claude aparecerán aquí; la primera tuya la creas con el botón de arriba.' : 'Sin conexión al almacén: tus pizarras se guardan solo en este navegador.'; box.append(e); }
  for (const p of list) {
    const card = document.createElement('button'); card.className = 'card' + (p.id === openId ? ' active' : '');
    const c = document.createElement('canvas'); c.width = c.height = 200; card.append(c);
    const meta = document.createElement('div'); meta.className = 'meta';
    const w = document.createElement('span'); w.className = 'who ' + (isClaude(p) ? 'claude' : 'user'); w.textContent = isClaude(p) ? 'Claude' : 'Tú';
    meta.append(w);
    if (needsAnswer(p)) { const t = document.createElement('span'); t.className = 'todo'; t.textContent = '● responder'; meta.append(t); }
    card.append(meta);
    const b = document.createElement('b'); b.textContent = p.title || 'Sin nombre'; card.append(b);
    const d = document.createElement('p'); d.textContent = (isClaude(p) && p.reply) ? '↳ ' + p.reply : (p.desc || ''); card.append(d);
    card.onclick = () => { openPad(p.id); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    box.append(card);
    drawInto(c, 200, p.size || 9, new Set(p.columns || []), new Set(p.walls || []), false);
  }
  $('out').value = exportJSON();
}

// ---------- export ----------
function encode(n, cols, ws) {
  const dirs = [[1, 0], [1, 1], [0, 1], [-1, 1]];
  return Array.from({ length: n }, (_, y) => Array.from({ length: n }, (_, x) => [cols.has(vk(x, y)) ? 1 : 0, ...dirs.map(([dx, dy]) => {
    const nx = x + dx, ny = y + dy;
    return nx >= 0 && ny >= 0 && nx < n && ny < n && ws.has(wk([x, y], [nx, ny])) ? 1 : 0;
  })]));
}
function exportJSON() {
  return JSON.stringify({
    format: 'masmorra-sketch/2',
    note: 'grid[y][x] = [column, wall_E, wall_SE, wall_S, wall_SW]; walls = "x1,y1|x2,y2"',
    examples: pads.map(p => ({ ...p, grid: encode(p.size || 9, new Set(p.columns || []), new Set(p.walls || [])) })),
  });
}
$('copy').onclick = () => {
  const t = $('out'); t.value = exportJSON();
  const fb = () => { t.focus(); t.select(); toast('Seleccionado: copia manualmente'); };
  navigator.clipboard ? navigator.clipboard.writeText(t.value).then(() => toast(`Copiadas ${pads.length} pizarras`), fb) : fb();
};
$('import').onclick = async () => {
  let list;
  try { const d = JSON.parse($('out').value); list = d.examples || d; } catch { toast('JSON no válido'); return; }
  try {
    for (const raw of list) {
      const { grid, id, ...p } = raw;
      const pid = id || 'u' + Math.random().toString(36).slice(2, 9);
      if (db) await db.collection(COL).doc(pid).set(p); else upsertLocal({ ...p, id: pid });
    }
    toast(`Importadas ${list.length}`);
  } catch { toast('Falló la importación'); }
};

// ---------- boot ----------
new ResizeObserver(layout).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { draw(); renderGallery(); });
pads = loadLocal(); sortPads(); openPad(null);
$('sync').textContent = 'local';

(async () => {
  db = await window.claude?.use?.('db').catch(() => null) ?? null;
  if (!db) { $('sync').textContent = 'solo en este navegador'; renderGallery(); return; }
  $('sync').textContent = 'conectando…';
  db.collection(COL).onSnapshot(snap => {
    pads = snap.docs.map(d => ({ id: d.id, ...d.data() })); sortPads();
    $('sync').textContent = 'sincronizado ✓';
    if (!dirty) {
      if (openId === null && !$('title').value) {
        const first = pads.find(needsAnswer) || pads[0];
        if (first) { openPad(first.id); return; }
      } else if (openId && pads.some(p => p.id === openId)) { openPad(openId); return; }
    }
    renderGallery();
  }, err => { $('sync').textContent = 'error de sync: ' + (err?.code || ''); });
})();
</script>
